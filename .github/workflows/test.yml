name: test

# Runs the full bootstrap (./install twice + checks) on fresh machines,
# including the private personal layer. All jobs run in parallel.
#
# Needs a repo secret PERSONAL_DOTFILES_DEPLOY_KEY: the private half of a
# read-only deploy key on mtslucasmartins/personal-dotfiles.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu:24, ubuntu:26]
    steps:
      - uses: actions/checkout@v5
      - name: Fetch personal submodule
        env:
          DEPLOY_KEY: ${{ secrets.PERSONAL_DOTFILES_DEPLOY_KEY }}
        run: .github/fetch-personal.sh
      # Same Docker-based test as `make test TARGET=...`; the container clones
      # personal from this checkout.
      - run: tests/run_tests.sh --target=${{ matrix.target }}

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch personal submodule
        env:
          DEPLOY_KEY: ${{ secrets.PERSONAL_DOTFILES_DEPLOY_KEY }}
        run: .github/fetch-personal.sh
      # The test clones personal from this checkout (a local path), which git
      # blocks for submodules by default. The Docker images allow it the same
      # way; the runner is thrown away after the job.
      - run: git config --global protocol.file.allow always
      # No Docker for macOS: the runner is a fresh VM, so test on it directly.
      - run: bash tests/smoke.sh
        env:
          SRC: ${{ github.workspace }}
